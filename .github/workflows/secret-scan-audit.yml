name: Secret Scan Audit

# Weekly audit of the full published main history. Catches drift and any
# historical exposure the per-push gate (secret-scan.yml, delta-scoped) cannot
# see. This job FAILS on any finding: a failed scheduled workflow emails the
# repository owner. We deliberately do NOT open a GitHub Issue on a finding,
# because this repo is PUBLIC and the issue body would republish the leak.
# Triage the uploaded SARIF artifact privately instead.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: main

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          mkdir -p "$HOME/bin"
          mv gitleaks "$HOME/bin/"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Audit origin/main history (fail on any finding)
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --log-opts="origin/main" \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-audit
          path: gitleaks.sarif
          if-no-files-found: ignore
