name: E2E Tests (Vercel Preview)

on:
  deployment_status:

concurrency:
  # One E2E run per deployment - cancel stale if a new deploy lands.
  group: e2e-${{ github.event.deployment_status.environment_url }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed for deployment_status context
  deployments: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # deployment_status fires for production deployments too. Without the
    # environment check this suite runs against the live site, where
    # maintenance-gate.spec.js toggles the real maintenance flag.
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Preview'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: npm

      # Skip install scripts: anything they plant in node_modules runs in the step that holds the secrets.
      - run: npm ci --ignore-scripts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ADMIN_SLUG: ${{ secrets.ADMIN_SLUG }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
