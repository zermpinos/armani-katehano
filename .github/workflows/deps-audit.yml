name: Dependency Audit

on:
  push:
    branches: [main]
    paths: [package-lock.json, .github/audit-exceptions.json, scripts/ci/check-audit.mjs,
            .github/workflows/deps-audit.yml]
  pull_request:
    branches: [main]
    paths: [package-lock.json, .github/audit-exceptions.json, scripts/ci/check-audit.mjs,
            .github/workflows/deps-audit.yml]
  # Monday 09:00 Athens (EEST = UTC+3) = 06:00 UTC
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (prod + dev)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - name: Verify package signatures
        run: npm audit signatures
        continue-on-error: true
      # Production above takes no exceptions; here a dev-only advisory may be
      # accepted in .github/audit-exceptions.json with a reason and review date.
      - name: Audit all dependencies against accepted exceptions
        run: node scripts/ci/check-audit.mjs

  weekly-report:
    name: Weekly security report
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Generate report and open issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/weekly-security-report.sh
